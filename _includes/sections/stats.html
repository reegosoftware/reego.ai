<section class="section section--tight">
  <div class="container">
    <ul class="stats">
      {%- for s in site.data.company.stats %}
      <li class="stat" data-reveal><span class="stat__value">{{ s.value }}</span><span class="stat__label">{{ s.label }}</span></li>
      {%- endfor %}
    </ul>
  </div>
</section>
