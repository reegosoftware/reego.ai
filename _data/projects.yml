# ---------------------------------------------------------------------------
# Products, open-source packages and client work.
# Shown on /work/ (all) and on the home page (featured: true).
#
# Fields
#   name         display name                                   (required)
#   kind         product | open-source | client | tool           (required)
#   tagline      one-liner                                        (required)
#   description  2–3 sentences
#   tags         list of short tags, used by the filter on /work/
#   registry     pypi | npm (shows a registry badge)
#   install      shell command with a copy button
#   logo         square logo, e.g. /assets/img/work/logos/foo.svg
#   image        screenshot (16:9), e.g. /assets/img/work/shots/foo.svg
#   metric       highlighted result, e.g. "$80K/yr saved"
#   featured     true → also shown on the home page
#   links        list of { label, url }
#
# To add a project: copy a block, edit it, commit. That's it.
# ---------------------------------------------------------------------------

- name: ToolCalling.ai
  logo: /assets/img/work/logos/toolcalling.svg
  image: /assets/img/work/shots/toolcalling.svg
  kind: product
  featured: true
  tagline: The function-calling playground for LLMs
  description: >-
    A developer playground for LLM tool / function calling. Design tool
    schemas and test them against OpenAI-compatible, Llama-compatible and
    Anthropic models with your own API key.
  tags: [Agents, Tool calling, LLM]
  links:
    - { label: toolcalling.ai, url: "https://toolcalling.ai" }

- name: FastData
  logo: /assets/img/work/logos/fastdata.svg
  image: /assets/img/work/shots/fastdata.svg
  kind: open-source
  featured: true
  registry: npm
  install: npx fastdata
  tagline: Ask your database questions in plain language
  description: >-
    Data self-service for everyone. A Claude agent reads your knowledge base,
    writes read-only SQL, runs it through your own connector (Postgres, MySQL,
    SQLite or any MCP SQL server) and answers in Markdown. Born from a
    text-to-SQL agent we built for a data team.
  tags: [Agents, Data, Text-to-SQL, MCP]
  links:
    - { label: Docs,   url: "https://fastdata-docs.vercel.app/" }
    - { label: npm,    url: "https://www.npmjs.com/package/fastdata" }
    - { label: GitHub, url: "https://github.com/yilmazhasan/fastdata" }

- name: DevGuard Scanner
  logo: /assets/img/work/logos/devguard.svg
  image: /assets/img/work/shots/devguard.svg
  kind: open-source
  featured: true
  registry: pypi
  install: pipx install devguard-scanner
  tagline: Scan untrusted repos for malware before you open them
  description: >-
    Fake interview tasks, poisoned forks and hijacked packages run code the
    moment you open the folder. DevGuard finds those triggers — VS Code tasks,
    install scripts, git and AI-assistant hooks — follows them to the code they
    run, and gives a verdict. It never executes anything.
  tags: [Security, Python, CLI]
  links:
    - { label: PyPI,   url: "https://pypi.org/project/devguard-scanner/" }
    - { label: GitHub, url: "https://github.com/yilmazhasan/devguard-scanner" }

