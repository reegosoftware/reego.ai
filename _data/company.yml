hero:
  eyebrow: AI engineering studio
  title_before: "We build AI that"
  title_highlight: "actually ships."
  subtitle: >-
    Agents, automations, ML systems and MVPs — designed, engineered and
    deployed by a team that builds AI developer tooling for a living.
  primary_cta:   { label: Start a project, url: "/#contact" }
  secondary_cta: { label: See our work,    url: "/work/" }
  badges:
    - Agents & tool calling
    - Context engineering
    - From idea to production

  # The animated "agent run" in the hero. kind: cmd | user | tool | think | ok
  terminal:
    title: reego · agent run
    lines:
      - { kind: cmd,   text: "reego run revenue-agent" }
      - { kind: user,  text: "Which accounts churned last week, and why?" }
      - { kind: think, text: "planning · 3 tools available" }
      - { kind: tool,  text: "sql.query(\"churned_accounts\", days=7)",   meta: "42 rows · 180ms" }
      - { kind: tool,  text: "crm.notes(account_ids=[…42])",              meta: "ok · 410ms" }
      - { kind: think, text: "clustering churn reasons…" }
      - { kind: tool,  text: "slack.post(#revenue, report.md)",           meta: "sent" }
      - { kind: ok,    text: "done in 6.2s · 3 tool calls · $0.011" }

