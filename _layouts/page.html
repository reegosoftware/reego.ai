---
layout: default
---
<section class="page-hero">
  <div class="hero__bg" aria-hidden="true"><div class="hero__grid"></div><div class="hero__glow hero__glow--a"></div><div class="hero__glow hero__glow--b"></div></div>
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-hero__title">{{ page.heading | default: page.title }}</h1>
    {%- if page.description %}<p class="page-hero__intro">{{ page.description }}</p>{% endif %}
  </div>
</section>
{{ content }}
