o-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve"><tspan fill="#ff6b7a">FROM </tspan><tspan fill="#dfe3ee">revenue_monthly </tspan><tspan fill="#ff6b7a">WHERE </tspan><tspan fill="#dfe3ee">quarter = </tspan><tspan fill="#fdc301">'2026-Q3' </tspan><tspan fill="#ff6b7a">GROUP BY </tspan><tspan fill="#dfe3ee">1 </tspan><tspan fill="#ff6b7a">ORDER BY </tspan><tspan fill="#dfe3ee">2 </tspan><tspan fill="#ff6b7a">DESC</tspan></text><text x="22" y="230" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#3ddc97" text-anchor="start">ANSWER</text><text x="30" y="252" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a91a3" text-anchor="start">Region</text><text x="330" y="252" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a91a3" text-anchor="start">MRR growth</text><text x="610" y="252" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a91a3" text-anchor="end">Δ q/q</text><line x1="22" y1="260" x2="618" y2="260" stroke="#fff" stroke-opacity=".06"/><text x="30" y="276" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#dfe3ee" text-anchor="start">EMEA</text><text x="330" y="276" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#dfe3ee" text-anchor="start">$184,200</text><text x="610" y="276" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#3ddc97" text-anchor="end">+12.4%</text><line x1="22" y1="284" x2="618" y2="284" stroke="#fff" stroke-opacity=".0