<text x="320" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5d6475" text-anchor="middle">node — custom-permutation</text>
<text x="22" y="56" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#2ec7d6">$ </tspan><tspan fill="#ffffff">npm i custom-permutation</tspan></text><text x="22" y="87" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#8a91a3">&gt; </tspan><tspan fill="#5d6475">// all orderings of A, B, C where A comes first</tspan></text><text x="22" y="108" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#8a91a3">&gt; </tspan><tspan fill="#dfe3ee">permutations</tspan><tspan fill="#8a91a3">.</tspan><tspan fill="#2ec7d6">forEach</tspan><tspan fill="#8a91a3">(p =&gt; </tspan><tspan fill="#dfe3ee">console</tspan><tspan fill="#8a91a3">.</tspan><tspan fill="#2ec7d6">log</tspan><tspan fill="#8a91a3">(p))</tspan></text><text x="22" y="139" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#8a91a3">[ </tspan><tspan fill="#fdc301">'A'</tspan><tspan fill="#8a91a3">, </tspan><tspan fill="#fdc301">'B'</tspan><tspan fill="#8a91a3">, </tspan><tspan fill="#fdc301">'C'</tspan><tspan fill="#8a91a3"> ]</tspan></text><text x="22" y="160" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#8a91a3">[ </tspan><tspan fill="#fdc301">'A'</tspan><tspan fill="#8a91a3">, </tspan><tspan fill="#fdc301">'C'</tspan><tspan fill="#8a91a3">, </tspan><tspan fill="#fdc301">'B'</tspan><tspan fill="#8a91a3"> ]</tspan></text><text x="22" y="191" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#3ddc97">✓ </tspan><tspan fill="#dfe3ee">2 of 6 permutations matched your rules</tspan></text><text x="22" y="212" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" xml:space="preserve"><tspan fill="#8a91a3">  also on PyPI: </tspan><tspan fill="#2ec7d6">custom-permutation</tspan><tspan fill="#8a91a3">, </tspan><tspan fill="#2ec7d6">custom-combination</tspan></text>
